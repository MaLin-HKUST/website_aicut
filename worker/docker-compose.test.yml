services:
  postgres:
    image: postgres:16-alpine
    container_name: smart-cut-worker-postgres-test
    environment:
      - POSTGRES_DB=scheduler
      - POSTGRES_USER=scheduler
      - POSTGRES_PASSWORD=scheduler
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler -d scheduler"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  worker:
    build:
      context: ..
      dockerfile: worker/Dockerfile
    image: smart-cut-worker-gateway:test
    container_name: smart-cut-worker-test
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - WORKER_ID=worker_01
      - WORKER_NAME=Smart Cut Worker 01
      - DATABASE_URL=postgresql+psycopg2://scheduler:scheduler@postgres:5432/scheduler
      - USE_FAKE_TOS=true
      - FAKE_TOS_BASE_PATH=/tmp/fake_tos
      - SUPPORTED_TASK_TYPES=smart_cut_analyze,smart_cut_preview,smart_cut_finalize
      - POLL_INTERVAL=5
      - HEARTBEAT_INTERVAL=10
      - LOG_LEVEL=INFO
      - PYTHONPATH=/app
      - WORKER_DATA_BASE=/data/worker-jobs
    volumes:
      # 持久化数据目录
      - ./data:/app/data
      - worker-data:/data/worker-jobs
      - ./logs:/app/logs
    working_dir: /app
    healthcheck:
      test: ["CMD", "python", "-m", "worker.main", "--check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  postgres-data:
  worker-data:
