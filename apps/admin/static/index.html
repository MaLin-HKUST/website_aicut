<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin DB Test - 数据库管理测试</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .tab-active { border-bottom: 2px solid #3b82f6; color: #3b82f6; }
        .tab-inactive { border-bottom: 2px solid transparent; color: #6b7280; }
        .tab-inactive:hover { color: #374151; }

</head>
<body class="bg-gray-100 min-h-screen">
    <div id="app">
        <!-- 导航栏 -->
        <nav class="bg-white shadow-sm border-b">
            <div class="max-w-7xl mx-auto px-4">
                <div class="flex justify-between h-16">

                    <div class="flex space-x-8">
                        <button onclick="showTab('companies')" id="tab-companies" class="tab-active px-3 py-2 text-sm font-medium">企业管理</button>
                        <button onclick="showTab('users')" id="tab-users" class="tab-inactive px-3 py-2 text-sm font-medium">用户管理</button>
                        <button onclick="showTab('libraries')" id="tab-libraries" class="tab-inactive px-3 py-2 text-sm font-medium">素材库</button>
                        <button onclick="showTab('tags')" id="tab-tags" class="tab-inactive px-3 py-2 text-sm font-medium">标签管理</button>
                        <button onclick="showTab('custom-groups')" id="tab-custom-groups" class="tab-inactive px-3 py-2 text-sm font-medium">自定义标签组</button>

        <!-- 主内容区 -->

            <!-- 消息提示 -->

            <!-- 素材库管理 -->

                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">所属企业</th>

                        </thead>

            <!-- 标签管理 -->

    <!-- 企业模态框 -->

        <div class="flex items-center justify-center min-h-screen p-4">

                        <label class="block text-sm font-medium text-gray-700">企业名称</label>

                    <div class="flex items-center space-x-4">

    <!-- 用户模态框 -->

                    <div>

                        <button type="button" onclick="closeModal('user-modal')" class="px-4 py-2 border rounded-md hover:bg-gray-50">取消</button>

            <div class="bg-white rounded-lg shadow-xl max-w-lg w-full p-6">
                <h3 class="text-lg font-medium mb-4" id="library-modal-title">新增素材库</h3>
                <form id="library-form" class="space-y-4">

                    <div>
                        <label class="block text-sm font-medium text-gray-700">所属企业</label>
                        <select id="library-company" class="mt-1 block w-full border rounded-md px-3 py-2" required></select>
                    </div>
                    <div>

                        <input type="text" id="library-name" class="mt-1 block w-full border rounded-md px-3 py-2" required>

                    </div>

                    <div class="flex justify-end space-x-3 pt-4">

                        <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">保存</button>

    <!-- 标签组模态框 -->

            <div class="bg-white rounded-lg shadow-xl max-w-lg w-full p-6 max-h-[90vh] overflow-y-auto">
                <h3 class="text-lg font-medium mb-4" id="custom-group-modal-title">新增自定义标签组</h3>
                <form id="custom-group-form" class="space-y-4">
                    <input type="hidden" id="custom-group-id">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">所属企业</label>
                        <select id="custom-group-company" class="mt-1 block w-full border rounded-md px-3 py-2" onchange="loadCompanyUsers()" required></select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">所属用户</label>
                        <select id="custom-group-user" class="mt-1 block w-full border rounded-md px-3 py-2" required></select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">所属素材库</label>
                        <select id="custom-group-library" class="mt-1 block w-full border rounded-md px-3 py-2" onchange="loadLibraryTags()" required></select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">组名称</label>
                        <input type="text" id="custom-group-name" class="mt-1 block w-full border rounded-md px-3 py-2" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">描述</label>

                    </div>

                        <label class="block text-sm font-medium text-gray-700 mb-2">选择标签</label>

                    <div class="flex justify-end space-x-3 pt-4">
                        <button type="button" onclick="closeModal('custom-group-modal')" class="px-4 py-2 border rounded-md hover:bg-gray-50">取消</button>
                        <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">保存</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        // ============ 全局状态 ============
        const API_BASE = '';
        let currentTab = 'companies';
        let allTags = [];

        // ============ Tab 切换 ============
        function showTab(tab) {
            // 隐藏所有面板
            document.querySelectorAll('[id^="panel-"]').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('[id^="tab-"]').forEach(el => {
                el.classList.remove('tab-active');
                el.classList.add('tab-inactive');
            });
            
            // 显示选中面板
            document.getElementById(`panel-${tab}`).classList.remove('hidden');
            document.getElementById(`tab-${tab}`).classList.add('tab-active');
            document.getElementById(`tab-${tab}`).classList.remove('tab-inactive');
            
            currentTab = tab;
            
            // 加载数据
            if (tab === 'companies') loadCompanies();
            if (tab === 'users') loadUsers();
            if (tab === 'libraries') loadLibraries();
            if (tab === 'tags') loadTagGroups();
            if (tab === 'custom-groups') loadCustomGroups();
        }

        // ============ 模态框 ============
        async function openModal(id) {
            document.getElementById(id).classList.remove('hidden');
            
            // 新增企业时清空表单
            if (id === 'company-modal') {
                document.getElementById('company-id').value = '';
                document.getElementById('company-form').reset();
                document.getElementById('company-modal-title').textContent = '新增企业';
                // 设置默认值
                document.getElementById('company-quota').value = 100;
                document.getElementById('company-remaining').value = 100;
                document.getElementById('company-billing-date').value = new Date().toISOString().split('T')[0];
                document.getElementById('company-active').checked = true;
            }
            
            if (id === 'user-modal' || id === 'library-modal') await loadCompanySelects();
            if (id === 'tag-group-modal') await loadLibrarySelect('tag-group-library');
            if (id === 'tag-modal') {
                await loadLibrarySelect('tag-library');
                await loadTagGroupSelect();  // 加载标签组下拉框
            }
            if (id === 'custom-group-modal') {
                // 检查是否是编辑模式（ID字段有值）
                const groupId = document.getElementById('custom-group-id').value;
                if (!groupId) {

        // ============ API 调用 ============
        async function api(url, method = 'GET', data = null) {
            const options = { method, headers: {} };
            if (data) {
                options.headers['Content-Type'] = 'application/json';
                options.body = JSON.stringify(data);
            }
            const res = await fetch(API_BASE + url, options);
            if (!res.ok) {
                const errData = await res.json().catch(() => ({ error: 'Unknown error' }));
                const error = new Error(errData.message || errData.error || 'Request failed');
                error.status = res.status;
                error.code = errData.error;
                throw error;
            }
            return res.json();
        }

                tagMap = Object.fromEntries(tags.map(t => [t.tag_id, t.tag_name]));
            } catch (e) {
                console.error('加载标签失败:', e);
            }
            
            // 获取标签名称
            const tagNames = tagIds.map(tid => tagMap[tid] || tid);
            
            // 创建漂亮的弹窗
            const modal = document.createElement('div');
            modal.className = 'fixed inset-0 bg-gray-500 bg-opacity-75 flex items-center justify-center z-50';
            modal.id = 'view-custom-group-modal';
            modal.innerHTML = `
                <div class="bg-white rounded-lg shadow-xl max-w-md w-full p-6 m-4">
                    <h3 class="text-lg font-semibold text-gray-900 mb-4">${result.group.group_name}</h3>
                    <p class="text-sm text-gray-600 mb-4">${result.group.description || '暂无描述'}</p>
                    <div class="mb-4">
                        <h4 class="text-sm font-medium text-gray-700 mb-2">包含标签 (${tagNames.length}个):</h4>
                        <div class="bg-gray-50 rounded p-3 max-h-40 overflow-y-auto">
                            ${tagNames.length > 0 
                                ? tagNames.map(name => `<div class="text-sm text-gray-800 py-1">• ${name}</div>`).join('')
                                : '<div class="text-sm text-gray-500">暂无标签</div>'
                            }
                        </div>
                    </div>
                    <div class="flex justify-end">
                        <button onclick="document.getElementById('view-custom-group-modal').remove()" 
                                class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">
                            关闭
                        </button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
            
            // 点击背景关闭
            modal.addEventListener('click', (e) => {
                if (e.target === modal) modal.remove();
            });
        }

        // 编辑自定义组
        async function editCustomGroup(id) {
            const result = await api(`/api/custom-groups/${id}`);
            const group = result.group;
            const selectedTagIds = result.tag_ids || [];
            
            // 填充表单
            document.getElementById('custom-group-id').value = id;
            document.getElementById('custom-group-name').value = group.group_name;
            document.getElementById('custom-group-desc').value = group.description || '';
            
            // 加载企业和用户下拉框
            await loadCompanySelect('custom-group-company');
            await loadLibrarySelect('custom-group-library');
            
            // 设置选中的值
            document.getElementById('custom-group-company').value = group.company_id;
            await loadCompanyUsers();
            document.getElementById('custom-group-user').value = group.user_id;
            document.getElementById('custom-group-library').value = group.asset_library_id;
            
            // 加载标签并设置选中状态
            await loadLibraryTags();
            const checkboxes = document.querySelectorAll('input[name="custom-tags"]');
            checkboxes.forEach(cb => {
                if (selectedTagIds.includes(cb.value)) {
                    cb.checked = true;
                }
            });
            
            document.getElementById('custom-group-modal-title').textContent = '编辑自定义标签组';
            openModal('custom-group-modal');
        }

        async function deleteCustomGroup(id) {
            if (!confirm('确定删除该自定义标签组？')) return;
            await api(`/api/custom-groups/${id}`, 'DELETE');
            showMessage('自定义标签组已删除');
            loadCustomGroups();
        }

        // ============ 初始化 ============
        window.onload = () => {
            showTab('companies');
        };
    </script>
</body>
</html>
