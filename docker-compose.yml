services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-website_aicut}
      POSTGRES_USER: ${POSTGRES_USER:-website_aicut}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-website_aicut}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-website_aicut} -d ${POSTGRES_DB:-website_aicut}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-website_aicut}:${POSTGRES_PASSWORD:-website_aicut}@db:5432/${POSTGRES_DB:-website_aicut}
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Malin123456}
      SESSION_SECRET: ${SESSION_SECRET:-change-this-secret}
      MINIMAX_AUDIO_API_KEY: ${MINIMAX_AUDIO_API_KEY:-}
      MINIMAX_AUDIO_GROUP_ID: ${MINIMAX_AUDIO_GROUP_ID:-}
      MINIMAX_TTS_VOICE_ID: ${MINIMAX_TTS_VOICE_ID:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
    environment:
      INTERNAL_API_BASE_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
